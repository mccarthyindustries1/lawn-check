<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lawn Check</title>
  <meta name="description" content="Tells you whether your lawn needs water, based on real rain and the forecast.">
  <meta name="theme-color" content="#16352a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lawn Check">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Lawn Check</h1>
    </header>

    <form class="zip" id="zipForm" autocomplete="on" novalidate>
      <label class="sr" for="zip">ZIP code</label>
      <input id="zip" name="zip" inputmode="numeric" pattern="[0-9]{5}" maxlength="5"
             autocomplete="postal-code" placeholder="ZIP code" enterkeyhint="go">
      <button type="submit" id="checkBtn">Check</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="report" hidden></div>

    <section class="alerts" id="alerts" hidden>
      <h2>Daily alert</h2>
      <div id="alertsBody"></div>
      <div id="syncBox"></div>
    </section>

    <footer class="credits" id="credits"></footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
