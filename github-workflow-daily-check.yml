name: Daily lawn check

on:
  schedule:
    # 11:15 UTC = 7:15 AM Eastern in summer, 6:15 AM in winter.
    - cron: "15 11 * * *"
  workflow_dispatch:   # lets you run it by hand with the "Run workflow" button

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node scripts/send-alert.mjs
        env:
          ALERT_CONFIG: ${{ secrets.ALERT_CONFIG }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          ALERT_MODE: ${{ vars.ALERT_MODE }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' }}
